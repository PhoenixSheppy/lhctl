name: flatpak
# Only build when something that ends up in the Flatpak changes. Docs, README, get.sh,
# install scripts etc. don't trigger a build. Tag pushes (v*) always build (GitHub ignores
# path filters for tags), and you can force one from the Actions tab with "Run workflow".
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'packaging/com.phoenixnet_labs.LighthouseCtl.yml'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'packaging/com.phoenixnet_labs.LighthouseCtl.yml'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

jobs:
  build:
    # Native arm64 runner: the Steam Frame is aarch64.
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: lhctl.flatpak
          manifest-path: packaging/com.phoenixnet_labs.LighthouseCtl.yml
          arch: aarch64
          cache-key: flatpak-builder-${{ github.sha }}

  # Every push to main becomes a numbered release (v<version>-build.<N>) and is marked Latest,
  # so packaging/get.sh always picks it up. Pushing a tag like v0.2.0 releases under that name.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: lhctl-aarch64.flatpak
          path: dist

      - name: Pick release name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep -oP 'project\(lhctl VERSION \K[0-9.]+' CMakeLists.txt)
            echo "tag=v${ver}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          ls -la dist
          (cd dist && sha256sum lhctl.flatpak > lhctl.flatpak.sha256)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: lhctl ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/lhctl.flatpak
            dist/lhctl.flatpak.sha256
          body: |
            Steam Frame (aarch64) Flatpak bundle.

            Install or update on the Frame (Desktop Mode → Konsole):
            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/packaging/get.sh | bash
            ```
            If `probe` can't reach SteamVR from the sandbox:
            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/packaging/get.sh | bash -s -- --unsandboxed
            ```
