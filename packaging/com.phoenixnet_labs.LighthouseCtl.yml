app-id: com.phoenixnet_labs.LighthouseCtl
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lhctl

finish-args:
  # SteamVR rejects OpenVR clients from inside a sandbox (vrserver internal error 124), so
  # `lhctl run`, `launch` and `probe` re-run the app's own binary on the host through the
  # Flatpak portal (flatpak-spawn --host). This permission is what allows that; it means the
  # app is effectively unsandboxed, the same as BFR, which installs straight into ~/.local.
  - --talk-name=org.freedesktop.Flatpak

  # Bluetooth for the sandboxed CLI commands (scan/on/standby/sleep/blink): BlueZ over D-Bus.
  - --system-talk-name=org.bluez

  # Settings and the station list live in ~/.config/lhctl/config.ini (edit nicknames there).
  - --filesystem=xdg-config/lhctl:create

  # "Running in the background" notification when opened from the app menu.
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: lhctl
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - .flatpak-builder
          - flatpak-build
